[project]
name = "context-os"
version = "0.1.0"
description = "Local-first personal context system for profile-driven issue discovery"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "requests>=2.32.0,<3.0.0",
  "uvicorn>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "httpx>=0.27.0,<1.0.0",
  "ruff>=0.11.0,<1.0.0",
  "pyright>=1.1.0,<2.0.0",
]

[project.scripts]
contextos = "personal_agent.cli:main"
pcos = "personal_agent.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["personal_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
]

ignore = [
  "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["personal_agent"]
