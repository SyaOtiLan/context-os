name: Build ContextOS WebView APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/ContextOSWebView/**"
      - ".github/workflows/android-webview-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: android/ContextOSWebView
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: contextos-webview-debug-apk
          path: android/ContextOSWebView/app/build/outputs/apk/debug/app-debug.apk
